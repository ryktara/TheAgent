name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: pnpm (the DoD runner test drives stub package scripts through it)
        run: npm install -g pnpm
      - name: Validate skills, packs, schemas
        run: python scripts/foundry.py validate
      - name: Design check (palette contrast)
        run: python scripts/foundry.py design-check --palettes-only
      - name: Evals
        run: python evals/run.py
      - name: Unit tests
        run: python -m unittest scripts/test_foundry.py -v
      - name: Hook tests
        run: python hooks/test_hooks.py
