                  type: "string"
                events:
                  type: "array"
                  items:
                    type: "object"
                    properties:
                      seq:
                        type: "integer"
                      entity:
                        type: "string"
                      payload:
                        type: "object"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
        "400":
          description: "Error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Error"
          content:
            application/json:
              schema:
