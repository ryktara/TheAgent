  - {name: "SaleReturned", entity: "Sale", transition: "partially-returned->returned", producer: "sales", consumers: ["reporting", "sync", "inventory"]}
  - {name: "SaleVoid", entity: "Sale", transition: "open->void", producer: "sales", consumers: ["reporting", "sync", "inventory"]}
