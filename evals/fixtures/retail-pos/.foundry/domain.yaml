  - {name: "PurchaseOrderCancelled", entity: "PurchaseOrder", transition: "sent->cancelled", producer: "inventory", consumers: ["reporting"]}
  - {name: "GoodsReceiptPosted", entity: "GoodsReceipt", transition: "draft->posted", producer: "inventory", consumers: ["reporting"]}
  - {name: "StockCountCounting", entity: "StockCount", transition: "planned->counting", producer: "inventory", consumers: ["reporting"]}
  - {name: "StockCountReview", entity: "StockCount", transition: "counting->review", producer: "inventory", consumers: ["reporting"]}
  - {name: "StockCountPosted", entity: "StockCount", transition: "review->posted", producer: "inventory", consumers: ["reporting"]}
  - {name: "StockMovementRecorded", entity: "StockMovement", transition: "*->recorded", producer: "inventory", consumers: ["reporting"]}
  - {name: "TransferDispatched", entity: "Transfer", transition: "draft->dispatched", producer: "inventory", consumers: ["reporting"]}
  - {name: "TransferInTransit", entity: "Transfer", transition: "dispatched->in-transit", producer: "inventory", consumers: ["reporting"]}
  - {name: "TransferReceived", entity: "Transfer", transition: "in-transit->received", producer: "inventory", consumers: ["reporting"]}
  - {name: "TransferDiscrepancy", entity: "Transfer", transition: "in-transit->discrepancy", producer: "inventory", consumers: ["reporting"]}
  - {name: "SupplierBlocked", entity: "Supplier", transition: "active->blocked", producer: "inventory", consumers: ["reporting"]}
  - {name: "CashDrawerSessionClosed", entity: "CashDrawerSession", transition: "open->closed", producer: "sales", consumers: ["reporting", "sync"]}
  - {name: "CashDrawerSessionReconciled", entity: "CashDrawerSession", transition: "closed->reconciled", producer: "sales", consumers: ["reporting", "sync"]}
  - {name: "ReceiptReported", entity: "Receipt", transition: "issued->reported", producer: "sales", consumers: ["reporting", "sync"]}
  - {name: "ReceiptReportFailed", entity: "Receipt", transition: "issued->report-failed", producer: "sales", consumers: ["reporting", "sync"]}
  - {name: "ReceiptReprinted", entity: "Receipt", transition: "issued->reprinted", producer: "sales", consumers: ["reporting", "sync"]}
  - {name: "ReceiptVoided", entity: "Receipt", transition: "issued->voided", producer: "sales", consumers: ["reporting", "sync"]}
