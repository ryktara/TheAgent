pack: "retail-pos"
decisions_hash: "af8853fb0dac"
contexts: ["sales", "catalog", "inventory", "customers", "people", "sync", "reporting"]
entities:
  - {name: "Product", owned_by: "catalog", exposure: "public", fields: ["id", "name_en", "name_ar", "category_id", "brand", "tax_rule_id", "sold_by", "track_stock", "allow_negative", "image"], states: ["draft", "active", "discontinued"], invariants: ["A Product in state discontinued or a Variant out-of-stock with no allow_negative cannot be added to a new SaleLine"], transitions: [{from: "draft", to: "active", by: "store-manager", guard: "name_ar, name_en, tax_rule and at least one Variant set"}, {from: "active", to: "discontinued", by: "store-manager", guard: "reason recorded"}]}
  - {name: "Variant", owned_by: "catalog", exposure: "public", fields: ["product_id", "sku", "size", "colour", "price", "cost", "mrp", "reorder_point"], states: ["active", "out-of-stock", "discontinued"], invariants: ["Variant on hand == sum(StockMovement.qty) per Store and never negative unless Store.allow_negative_stock is true", "A StockCount posted writes exactly one StockMovement of kind count-variance per Variant with non-zero variance", "A Product in state discontinued or a Variant out-of-stock with no allow_negative cannot be added to a new SaleLine", "Stock is held per Variant (size x colour) per Store; a Product has at least one Variant"], transitions: [{from: "active", to: "out-of-stock", by: "system", guard: "on hand reaches 0 and allow_negative is false"}, {from: "out-of-stock", to: "active", by: "system", guard: "StockMovement brings on hand above 0"}, {from: "active", to: "discontinued", by: "store-manager", guard: "reason recorded"}, {from: "out-of-stock", to: "discontinued", by: "store-manager", guard: "reason recorded"}]}
  - {name: "Barcode", owned_by: "catalog", exposure: "derived", fields: ["variant_id", "code", "symbology", "kind", "embedded", "pack_qty"], states: ["active", "retired"], invariants: ["A weighed SaleLine takes weight_g from the scale or an embedded Barcode; price == unit_price per kg * weight rounded once"], transitions: [{from: "active", to: "retired", by: "store-manager", guard: "reason recorded"}]}
  - {name: "Sale", owned_by: "sales", exposure: "public", fields: ["id", "client_uuid", "device_seq", "store_id", "staff_id", "customer_id", "subtotal", "discount_total", "tax_total", "total", "opened_at", "closed_at"], states: ["open", "parked", "tendering", "paid", "partially-returned", "returned", "void"], invariants: ["Sale.total == sum(SaleLine.line_total) - Sale.discount_total + Sale.tax_total, computed once in minor units at tender", "A Sale in state paid has captured Tender amounts summing exactly to Sale.total; change is given only from cash", "Every offline Sale carries a client_uuid and a device_seq monotonic per device; each SyncEvent acks exactly once", "Prices are stored tax-inclusive when TaxRule.inclusive is true and tax is extracted once per Sale", "Every state change on Sale, Tender, Return, CashDrawerSession, Promotion and StockCount writes one audit log event"], transitions: [{from: "open", to: "parked", by: "cashier", guard: "at least one SaleLine"}, {from: "parked", to: "open", by: "cashier", guard: "recalled on a till of the same Store"}, {from: "open", to: "tendering", by: "cashier", guard: "at least one active SaleLine"}, {from: "tendering", to: "open", by: "cashier", guard: "all Tenders voided or declined"}, {from: "tendering", to: "paid", by: "system", guard: "captured Tenders sum exactly to total"}, {from: "paid", to: "partially-returned", by: "cashier", guard: "Return refunded or exchanged for part of the lines"}, {from: "partially-returned", to: "returned", by: "cashier", guard: "every SaleLine fully returned"}, {from: "paid", to: "returned", by: "cashier", guard: "every SaleLine fully returned"}, {from: "open", to: "void", by: "cashier", guard: "reason recorded; manager-pin when lines exist"}, {from: "parked", to: "void", by: "cashier", guard: "reason recorded"}]}
  - {name: "SaleLine", owned_by: "sales", exposure: "derived", fields: ["sale_id", "variant_id", "qty", "weight_g", "unit_price", "list_price", "override_by", "promotion_id", "discount", "tax", "line_total", "serial"], states: ["active", "voided", "returned"], invariants: ["Sale.total == sum(SaleLine.line_total) - Sale.discount_total + Sale.tax_total, computed once in minor units at tender", "Returned qty per SaleLine never exceeds sold qty minus prior Return qty on that SaleLine", "A SaleLine whose unit_price differs from list_price carries override_by, an approver Staff id with override rights", "A weighed SaleLine takes weight_g from the scale or an embedded Barcode; price == unit_price per kg * weight rounded once", "A Product in state discontinued or a Variant out-of-stock with no allow_negative cannot be added to a new SaleLine"], transitions: [{from: "active", to: "voided", by: "cashier", guard: "before tender; manager-pin after first print"}, {from: "active", to: "returned", by: "cashier", guard: "Return qty equals sold qty"}]}
  - {name: "Tender", owned_by: "sales", exposure: "public", fields: ["sale_id", "kind", "amount", "provider_ref", "approval_code", "gift_card_id", "captured_at"], states: ["pending", "authorised", "captured", "declined", "refunded", "voided"], invariants: ["A Sale in state paid has captured Tender amounts summing exactly to Sale.total; change is given only from cash", "A Return refunds to the original Tender kind unless the approver Staff id authorises store credit on a GiftCard", "GiftCard.balance >= 0 at all times; each redemption is a Tender of kind gift-card that decrements balance atomically", "A CashDrawerSession closes with expected == opening_float + cash Tender - cash refunds - pickups; variance needs a Staff approver above policy", "Every state change on Sale, Tender, Return, CashDrawerSession, Promotion and StockCount writes one audit log event"], transitions: [{from: "pending", to: "authorised", by: "cashier", guard: "terminal approval code received"}, {from: "authorised", to: "captured", by: "system", guard: "capture confirmed"}, {from: "pending", to: "captured", by: "cashier", guard: "cash or gift-card tender"}, {from: "pending", to: "declined", by: "system", guard: "terminal declined or timed out after status query"}, {from: "captured", to: "refunded", by: "cashier", guard: "approved Return references this Tender"}, {from: "authorised", to: "voided", by: "cashier", guard: "reason recorded"}]}
  - {name: "Return", owned_by: "sales", exposure: "public", fields: ["sale_id", "lines", "reason", "refund_method", "approver_id", "restock"], states: ["requested", "approved", "refunded", "exchanged", "rejected"], invariants: ["Returned qty per SaleLine never exceeds sold qty minus prior Return qty on that SaleLine", "A Return refunds to the original Tender kind unless the approver Staff id authorises store credit on a GiftCard", "LoyaltyAccount.points == sum of earned minus redeemed; points are earned on the paid amount net of Return", "Every state change on Sale, Tender, Return, CashDrawerSession, Promotion and StockCount writes one audit log event"], transitions: [{from: "requested", to: "approved", by: "store-manager", guard: "inside 7-day window or manager-pin; qty within returnable"}, {from: "approved", to: "refunded", by: "cashier", guard: "refund to original tender kind"}, {from: "approved", to: "exchanged", by: "cashier", guard: "new Sale created with return credit"}, {from: "requested", to: "rejected", by: "store-manager", guard: "reason recorded"}]}
  - {name: "Promotion", owned_by: "sales", exposure: "internal", fields: ["name", "kind", "rules", "priority", "stackable", "starts_at", "ends_at", "store_ids"], states: ["draft", "scheduled", "active", "expired"], invariants: ["Promotion evaluation is deterministic: best non-stackable Promotion per line by priority, stackable ones applied after", "Every state change on Sale, Tender, Return, CashDrawerSession, Promotion and StockCount writes one audit log event"], transitions: [{from: "draft", to: "scheduled", by: "store-manager", guard: "rules previewed on a sample basket"}, {from: "scheduled", to: "active", by: "system", guard: "starts_at reached"}, {from: "active", to: "expired", by: "system", guard: "ends_at reached"}, {from: "scheduled", to: "expired", by: "store-manager", guard: "cancelled; reason recorded"}]}
  - {name: "LoyaltyAccount", owned_by: "customers", exposure: "public", fields: ["customer_id", "points", "tier", "lifetime_spend"], states: ["active", "frozen", "closed"], invariants: ["LoyaltyAccount.points == sum of earned minus redeemed; points are earned on the paid amount net of Return", "Points reversed on a Return never exceed points earned on that Sale"], transitions: [{from: "active", to: "frozen", by: "store-manager", guard: "reason recorded"}, {from: "frozen", to: "active", by: "store-manager", guard: "reason recorded"}, {from: "active", to: "closed", by: "owner", guard: "customer request; points forfeited"}]}
  - {name: "Customer", owned_by: "customers", exposure: "public", fields: ["name", "phone", "email", "khaata_balance", "credit_limit", "language"], states: ["guest", "registered", "blocked"], invariants: ["A Customer khaata_balance never exceeds credit_limit; a Supplier blocked receives no new PurchaseOrder"], transitions: [{from: "guest", to: "registered", by: "cashier", guard: "phone number captured"}, {from: "registered", to: "blocked", by: "store-manager", guard: "reason recorded"}]}
  - {name: "GiftCard", owned_by: "customers", exposure: "public", fields: ["code_hash", "kind", "balance", "currency", "expires_at", "issued_sale_id"], states: ["issued", "active", "redeemed", "expired", "void"], invariants: ["A Return refunds to the original Tender kind unless the approver Staff id authorises store credit on a GiftCard", "GiftCard.balance >= 0 at all times; each redemption is a Tender of kind gift-card that decrements balance atomically"], transitions: [{from: "issued", to: "active", by: "cashier", guard: ""}, {from: "active", to: "redeemed", by: "cashier", guard: ""}, {from: "active", to: "expired", by: "cashier", guard: "reason recorded"}, {from: "active", to: "void", by: "cashier", guard: "reason recorded"}]}
  - {name: "Layaway", owned_by: "customers", exposure: "public", fields: ["customer_id", "sale_id", "deposit", "balance", "due_at"], states: ["open", "paid", "collected", "cancelled", "expired"], invariants: ["A Layaway is collected only when balance == 0; stock is reserved by a StockMovement of kind reserve while open"], transitions: [{from: "open", to: "paid", by: "cashier", guard: ""}, {from: "paid", to: "collected", by: "cashier", guard: ""}, {from: "paid", to: "cancelled", by: "cashier", guard: "reason recorded"}, {from: "paid", to: "expired", by: "cashier", guard: "reason recorded"}]}
  - {name: "PurchaseOrder", owned_by: "inventory", exposure: "public", fields: ["supplier_id", "store_id", "lines", "expected_at", "total_cost"], states: ["draft", "sent", "partially-received", "received", "closed", "cancelled"], invariants: ["GoodsReceipt qty per line <= PurchaseOrder ordered qty minus received qty plus the Supplier tolerance percent", "A Customer khaata_balance never exceeds credit_limit; a Supplier blocked receives no new PurchaseOrder"], transitions: [{from: "draft", to: "sent", by: "stock-keeper", guard: ""}, {from: "sent", to: "partially-received", by: "stock-keeper", guard: ""}, {from: "partially-received", to: "received", by: "stock-keeper", guard: ""}, {from: "sent", to: "closed", by: "stock-keeper", guard: "reason recorded"}, {from: "sent", to: "cancelled", by: "stock-keeper", guard: "reason recorded"}]}
  - {name: "GoodsReceipt", owned_by: "inventory", exposure: "public", fields: ["purchase_order_id", "supplier_id", "store_id", "lines", "received_by", "invoice_ref"], states: ["draft", "posted"], invariants: ["GoodsReceipt qty per line <= PurchaseOrder ordered qty minus received qty plus the Supplier tolerance percent"], transitions: [{from: "draft", to: "posted", by: "stock-keeper", guard: "received qty within ordered plus tolerance"}]}
  - {name: "StockCount", owned_by: "inventory", exposure: "public", fields: ["store_id", "scope", "kind", "lines", "variance_value", "approved_by"], states: ["planned", "counting", "review", "posted"], invariants: ["A StockCount posted writes exactly one StockMovement of kind count-variance per Variant with non-zero variance", "Every state change on Sale, Tender, Return, CashDrawerSession, Promotion and StockCount writes one audit log event"], transitions: [{from: "planned", to: "counting", by: "stock-keeper", guard: "snapshot taken"}, {from: "counting", to: "review", by: "stock-keeper", guard: "all planned bins counted"}, {from: "review", to: "posted", by: "store-manager", guard: "variance value approved"}, {from: "review", to: "counting", by: "store-manager", guard: "recount requested"}]}
  - {name: "StockMovement", owned_by: "inventory", exposure: "derived", fields: ["variant_id", "store_id", "qty", "kind", "reference", "reason", "at"], states: ["recorded"], invariants: ["Variant on hand == sum(StockMovement.qty) per Store and never negative unless Store.allow_negative_stock is true", "A StockCount posted writes exactly one StockMovement of kind count-variance per Variant with non-zero variance", "A Transfer received writes a StockMovement out at the source Store and in at the target Store with equal qty, or a discrepancy", "A Layaway is collected only when balance == 0; stock is reserved by a StockMovement of kind reserve while open"], transitions: [{from: "*", to: "recorded", by: "system", guard: "source document posted: sale, return, receive, count-variance, adjustment or transfer"}]}
  - {name: "Transfer", owned_by: "inventory", exposure: "public", fields: ["from_store_id", "to_store_id", "lines", "dispatched_by", "received_by"], states: ["draft", "dispatched", "in-transit", "received", "discrepancy"], invariants: ["A Transfer received writes a StockMovement out at the source Store and in at the target Store with equal qty, or a discrepancy"], transitions: [{from: "draft", to: "dispatched", by: "stock-keeper", guard: "source on hand covers qty"}, {from: "dispatched", to: "in-transit", by: "system", guard: "StockMovement out written"}, {from: "in-transit", to: "received", by: "stock-keeper", guard: "scanned qty equals dispatched qty"}, {from: "in-transit", to: "discrepancy", by: "stock-keeper", guard: "scanned qty differs; owner review"}]}
  - {name: "Supplier", owned_by: "inventory", exposure: "public", fields: ["name", "trn", "contact", "terms", "lead_time_days", "return_policy"], states: ["active", "blocked"], invariants: ["GoodsReceipt qty per line <= PurchaseOrder ordered qty minus received qty plus the Supplier tolerance percent", "A Customer khaata_balance never exceeds credit_limit; a Supplier blocked receives no new PurchaseOrder"], transitions: [{from: "active", to: "blocked", by: "store-manager", guard: "reason recorded"}]}
  - {name: "CashDrawerSession", owned_by: "sales", exposure: "internal", fields: ["store_id", "device_id", "opened_by", "opening_float", "drops", "pickups", "counted", "expected", "variance"], states: ["open", "closed", "reconciled"], invariants: ["A CashDrawerSession closes with expected == opening_float + cash Tender - cash refunds - pickups; variance needs a Staff approver above policy", "Every state change on Sale, Tender, Return, CashDrawerSession, Promotion and StockCount writes one audit log event"], transitions: [{from: "open", to: "closed", by: "cashier", guard: "blind count entered"}, {from: "closed", to: "reconciled", by: "store-manager", guard: "variance within policy or manager-pin"}]}
  - {name: "Receipt", owned_by: "sales", exposure: "internal", fields: ["sale_id", "store_id", "number", "fiscal_qr", "fiscal_ref", "language", "issued_at"], states: ["issued", "reprinted", "voided", "reported", "report-failed"], invariants: ["Receipt numbers are gapless and increasing per Store; a reprint reuses the number and marks Receipt reprinted", "Every Receipt carries a ZATCA TLV QR (seller, VAT no, timestamp, total, VAT), a sequential invoice counter and the previous-invoice hash"], transitions: [{from: "issued", to: "reported", by: "system", guard: "ZATCA reporting accepted"}, {from: "issued", to: "report-failed", by: "system", guard: "ZATCA rejected or unreachable after retries"}, {from: "report-failed", to: "reported", by: "accountant", guard: "corrected and resubmitted"}, {from: "issued", to: "reprinted", by: "cashier", guard: "copy marked as reprint"}, {from: "issued", to: "voided", by: "store-manager", guard: "credit note issued; reason recorded"}]}
  - {name: "SyncEvent", owned_by: "sync", exposure: "internal", fields: ["device_id", "seq", "entity", "payload", "created_at"], states: ["pending", "sent", "acked", "conflict"], invariants: ["Every offline Sale carries a client_uuid and a device_seq monotonic per device; each SyncEvent acks exactly once"], transitions: [{from: "pending", to: "sent", by: "system", guard: "connectivity restored; device_seq order"}, {from: "sent", to: "acked", by: "system", guard: "server ack for client_uuid"}, {from: "sent", to: "conflict", by: "system", guard: "server state diverged"}, {from: "conflict", to: "acked", by: "store-manager", guard: "resolved on sync-status"}]}
  - {name: "TaxRule", owned_by: "sales", exposure: "internal", fields: ["region", "name", "rate", "inclusive", "applies_to"], states: ["active", "retired"], invariants: ["Prices are stored tax-inclusive when TaxRule.inclusive is true and tax is extracted once per Sale"], transitions: [{from: "active", to: "retired", by: "owner", guard: "reason recorded"}]}
  - {name: "Staff", owned_by: "people", exposure: "internal", fields: ["name", "pin_hash", "role", "store_ids", "override_limit_pct"], states: ["active", "suspended"], invariants: ["A Return refunds to the original Tender kind unless the approver Staff id authorises store credit on a GiftCard", "A SaleLine whose unit_price differs from list_price carries override_by, an approver Staff id with override rights", "A CashDrawerSession closes with expected == opening_float + cash Tender - cash refunds - pickups; variance needs a Staff approver above policy"], transitions: [{from: "active", to: "suspended", by: "owner", guard: "reason recorded"}, {from: "suspended", to: "active", by: "owner", guard: "reason recorded"}]}
  - {name: "Store", owned_by: "people", exposure: "internal", fields: ["name", "region", "currency", "timezone", "receipt_prefix", "fiscal_regime", "allow_negative_stock"], states: ["active", "suspended"], invariants: ["Variant on hand == sum(StockMovement.qty) per Store and never negative unless Store.allow_negative_stock is true", "A Transfer received writes a StockMovement out at the source Store and in at the target Store with equal qty, or a discrepancy", "Receipt numbers are gapless and increasing per Store; a reprint reuses the number and marks Receipt reprinted"], transitions: [{from: "active", to: "suspended", by: "owner", guard: "reason recorded"}]}
events:
  - {name: "ProductActive", entity: "Product", transition: "draft->active", producer: "catalog", consumers: ["reporting"]}
  - {name: "ProductDiscontinued", entity: "Product", transition: "active->discontinued", producer: "catalog", consumers: ["reporting"]}
  - {name: "VariantOutOfStock", entity: "Variant", transition: "active->out-of-stock", producer: "catalog", consumers: ["reporting"]}
