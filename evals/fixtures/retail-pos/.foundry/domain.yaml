  - {name: "TenderRefunded", entity: "Tender", transition: "captured->refunded", producer: "sales", consumers: ["reporting", "sync"]}
  - {name: "TenderVoided", entity: "Tender", transition: "authorised->voided", producer: "sales", consumers: ["reporting", "sync"]}
  - {name: "ReturnApproved", entity: "Return", transition: "requested->approved", producer: "sales", consumers: ["reporting", "sync", "inventory"]}
  - {name: "ReturnRefunded", entity: "Return", transition: "approved->refunded", producer: "sales", consumers: ["reporting", "sync", "inventory"]}
  - {name: "ReturnExchanged", entity: "Return", transition: "approved->exchanged", producer: "sales", consumers: ["reporting", "sync", "inventory"]}
  - {name: "ReturnRejected", entity: "Return", transition: "requested->rejected", producer: "sales", consumers: ["reporting", "sync", "inventory"]}
  - {name: "PromotionScheduled", entity: "Promotion", transition: "draft->scheduled", producer: "sales", consumers: ["reporting", "sync"]}
  - {name: "PromotionActive", entity: "Promotion", transition: "scheduled->active", producer: "sales", consumers: ["reporting", "sync"]}
  - {name: "PromotionExpired", entity: "Promotion", transition: "active->expired", producer: "sales", consumers: ["reporting", "sync"]}
  - {name: "LoyaltyAccountFrozen", entity: "LoyaltyAccount", transition: "active->frozen", producer: "customers", consumers: ["reporting"]}
  - {name: "LoyaltyAccountActive", entity: "LoyaltyAccount", transition: "frozen->active", producer: "customers", consumers: ["reporting"]}
  - {name: "LoyaltyAccountClosed", entity: "LoyaltyAccount", transition: "active->closed", producer: "customers", consumers: ["reporting"]}
  - {name: "CustomerRegistered", entity: "Customer", transition: "guest->registered", producer: "customers", consumers: ["reporting"]}
  - {name: "CustomerBlocked", entity: "Customer", transition: "registered->blocked", producer: "customers", consumers: ["reporting"]}
  - {name: "GiftCardActive", entity: "GiftCard", transition: "issued->active", producer: "customers", consumers: ["reporting"]}
