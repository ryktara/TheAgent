  - {name: "VariantDiscontinued", entity: "Variant", transition: "active->discontinued", producer: "catalog", consumers: ["reporting"]}
  - {name: "BarcodeRetired", entity: "Barcode", transition: "active->retired", producer: "catalog", consumers: ["reporting"]}
  - {name: "SaleParked", entity: "Sale", transition: "open->parked", producer: "sales", consumers: ["reporting", "sync", "inventory"]}
