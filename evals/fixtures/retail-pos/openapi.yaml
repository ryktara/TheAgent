              - "ae-fta-asp"
              - "om-fawtara-peppol"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
        "400":
          description: "Error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "409":
          description: "Error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      x-foundry:
        job: "einvoicing-webhook"
        personas:
          - "system"
        authz: "provider signature verified; idempotent on (provider, event_id)"
        idempotent: true
        offline_capable: false
        audit: true
