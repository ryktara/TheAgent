version: "1.4"
complete: true
threshold: 0.0
slug: generic
name: Generic Business App
aliases: [business app, internal tool, admin panel, back office, crud app, management system]
confidence_keywords: [app, application, software, system, platform, portal, dashboard, tool, records, admin, database, manage, management, workflow, forms, reports, users, roles, login, web app, mobile app, saas]
personas: [owner, admin, staff, customer]
jobs:
  - {id: sign-in, persona: staff, must: true, screens: [auth]}
  - {id: manage-records, persona: staff, must: true, screens: [list, detail, edit]}
  - {id: see-overview, persona: admin, must: true, screens: [dashboard]}
  - {id: run-reports, persona: admin, must: true, screens: [reports]}
  - {id: administer, persona: owner, must: true, screens: [settings, users-roles]}
  - {id: audit-activity, persona: owner, must: false, screens: [audit-log]}
must_have: [auth, roles, records-crud, search-filter, dashboard, reports, settings, audit-log, data-export, notifications]
should_have: [multi-tenant, file-attachments, bulk-import, api-keys, mobile-companion, i18n]
entities:
  Tenant: {states: [trial, active, suspended, closed]}
  User: {states: [invited, active, disabled]}
  Role: {states: [active]}
  Record: {states: [draft, active, archived]}
  AuditEvent: {states: [recorded]}
  Notification: {states: [pending, sent, read]}
invariants:
  - "Every Record belongs to exactly one Tenant"
  - "Every Notification targets one User and one Tenant"
  - "A Role belongs to one Tenant"
  - "Every User has at least one Role within a Tenant"
  - "Every state transition on Record writes one AuditEvent"
  - "Archived Records are read-only"
  - "Deleting a User never deletes AuditEvents they produced"
integrations: {auth: [email-password, google, microsoft], email: [resend, ses], storage: [s3, r2], payments: [stripe]}
regional:
  AE: {tax: "VAT 5%", privacy_law: "UAE PDPL", languages: [en, ar]}
  SA: {tax: "VAT 15%", privacy_law: "KSA PDPL", languages: [ar, en]}
  PK: {tax: "GST varies by province", privacy_law: "PDPB (draft)", languages: [en, ur]}
  EU: {tax: "VAT by member state", privacy_law: "GDPR", languages: [en]}
compliance_must: [AUT-01, AUT-05, AUD-01, PRV-04, PRV-05, SEC-01, SEC-02]
compliance_should: [AUT-08, AZ-02, SEC-03, SEC-06]
nfr_defaults: {offline: optional, p95_list_ms: 300, p95_save_ms: 500, uptime: "99.5%", backups: daily, rls: required-when-multi-tenant}
stack_default: {web: nextjs, api: hono, db: postgres, orm: drizzle, auth: better-auth, mobile: expo, hosting: vercel}
ui_profile: {style: clean-operational, density: medium, touch: 44dp, nav: sidebar, fonts: [Inter], dark: optional, rtl: when-ar}
questions:
  - {id: product-summary, rank: 1, ask: "In one sentence, what does the product do and for whom?", answer_type: text, default: "", reversible: true, maps_to: product.summary}
  - {id: primary-users, rank: 2, ask: "Who uses it day to day?", answer_type: choice, choices: [internal-staff, customers, both], default: internal-staff, reversible: true, skip_if_brief_mentions: [staff, employees, customers, clients, members], brief_hints: {internal-staff: [staff, employees, team, my people], customers: [customers, clients, members, public], both: [staff and customers, both]}, maps_to: product.primary_users}
  - {id: tenancy, rank: 3, ask: "One organisation, or many organisations each with their own data?", answer_type: choice, choices: [single, multi], default: single, reversible: false, followups: [{when: multi, ask: [scale]}], enables: {multi: [multi-tenant]}, skip_if_brief_mentions: [multi-tenant, saas, many companies, each client, multiple businesses], brief_hints: {multi: [multi-tenant, saas, many companies, each client, multiple businesses, franchise], single: [just us, one company, my company]}, maps_to: tenancy.mode}
  - {id: platform, rank: 4, ask: "Web, mobile, or both?", answer_type: choice, choices: [web, mobile, both], default: web, reversible: true, enables: {mobile: [mobile-companion], both: [mobile-companion]}, skip_if_brief_mentions: [web, mobile, ios, android, ipad, iphone, tablet, phone], brief_hints: {web: [web, browser, desktop], mobile: [mobile, ios, android, iphone, phone], both: [web and mobile, both]}, maps_to: platform.targets}
  - {id: region, rank: 5, ask: "Primary country of operation?", answer_type: choice, choices: [AE, SA, PK, EU, other], default: AE, reversible: true, followups: [{when: [AE, SA, PK], ask: [languages]}], skip_if_brief_mentions: [dubai, abu dhabi, sharjah, uae, emirates, riyadh, jeddah, saudi, ksa, karachi, lahore, islamabad, pakistan, europe, germany, france, uk], brief_hints: {AE: [dubai, abu dhabi, sharjah, ajman, uae, emirates], SA: [riyadh, jeddah, dammam, saudi, ksa], PK: [karachi, lahore, islamabad, pakistan], EU: [europe, germany, france, netherlands, spain, italy, uk, london]}, maps_to: region.country}
  - {id: auth-model, rank: 6, ask: "How do people sign in?", answer_type: choice, choices: [email-password, sso, magic-link, phone-otp], default: email-password, reversible: true, skip_if_brief_mentions: [sso, google login, microsoft login, magic link, otp, sms code], brief_hints: {sso: [sso, google login, microsoft login, azure ad, okta], magic-link: [magic link, passwordless], phone-otp: [otp, sms code, phone number login]}, maps_to: auth.model}
  - {id: payments, rank: 7, ask: "Does the app take payments?", answer_type: bool, default: false, reversible: true, followups: [{when: true, ask: [payment-provider]}], skip_if_brief_mentions: [payments, pay online, checkout, subscription, invoices, stripe, card], maps_to: payments.enabled}
  - {id: integrations, rank: 8, ask: "Which external systems must it connect to?", answer_type: text, default: "none", reversible: true, skip_if_brief_mentions: [integrate, integration, sync with, connect to, quickbooks, zoho, xero, whatsapp, slack], maps_to: integrations.required}
  - {id: offline, rank: 9, ask: "Must it keep working without internet?", answer_type: bool, default: false, reversible: false, skip_if_brief_mentions: [offline, without internet, internet drops, no connectivity], maps_to: nfr.offline}
  - {id: payment-provider, rank: 10, ask: "Which payment provider?", answer_type: choice, choices: [stripe, network-intl, tap, other], default: stripe, reversible: true, skip_if_brief_mentions: [stripe, network international, tap payments], brief_hints: {network-intl: [network international, n-genius], tap: [tap payments]}, maps_to: payments.provider}
  - {id: scale, rank: 11, ask: "Roughly how many users in year one?", answer_type: number, default: 50, reversible: true, maps_to: nfr.users_year_one}
  - {id: languages, rank: 12, ask: "Which languages must the UI support?", answer_type: choice, choices: [en, en-ar, en-ur, other], default: en, reversible: true, enables: {en-ar: [i18n], en-ur: [i18n], other: [i18n]}, skip_if_brief_mentions: [arabic, urdu, bilingual, rtl], brief_hints: {en-ar: [arabic, bilingual, rtl], en-ur: [urdu]}, maps_to: i18n.languages}
reference: {screens: reference/screens.md, workflows: reference/workflows.md, glossary: reference/glossary.csv, compliance: reference/compliance.md, ux_patterns: reference/ux-patterns.md}
