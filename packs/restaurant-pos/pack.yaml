entities:
  Order: {states: [draft, sent, in-progress, ready, served, billed, paid, closed, void, refunded], fields: [id, client_uuid, device_seq, branch_id, table_id, channel, covers, subtotal, discount_total, service_charge, tax_total, total, opened_at, closed_at]}
  OrderLine: {states: [pending, held, fired, ready, served, voided, comped], fields: [order_id, menu_item_id, variant_id, qty, unit_price, modifiers_total, line_total, course, seat, notes, allergens]}
  Modifier: {states: [active, hidden], fields: [group_id, name, price_delta, max_qty]}
  ModifierGroup: {states: [active, hidden], fields: [name, min_select, max_select, required]}
  Table: {states: [free, seated, ordered, billed, dirty, blocked], fields: [branch_id, zone, number, seats, shape, x, y]}
  Shift: {states: [open, closed, reconciled], fields: [branch_id, device_id, opened_by, opening_float, closing_count, expected_cash, variance]}
  Payment: {states: [pending, authorised, captured, declined, refunded, voided], fields: [order_id, amount, tender_id, provider_ref, approval_code, captured_at]}
  Tender: {states: [active, disabled], fields: [name, kind, provider, surcharge_pct, opens_drawer]}
  Refund: {states: [requested, approved, processed, failed], fields: [payment_id, amount, reason, approver_id]}
  Receipt: {states: [issued, reprinted, voided], fields: [order_id, branch_id, number, fiscal_qr, language, issued_at]}
  MenuItem: {states: [active, sold-out, hidden, seasonal], fields: [category_id, plu, name_en, name_ar, price, tax_rule_id, kitchen_station, image]}
  Variant: {states: [active, hidden], fields: [menu_item_id, name, price_delta, sku]}
  Course: {states: [scheduled, fired, served], fields: [order_id, sequence, name, fired_at]}
  KitchenTicket: {states: [new, in-progress, ready, bumped, recalled], fields: [order_id, station, lines, fired_at, bumped_at, age_seconds]}
  Reservation: {states: [requested, confirmed, seated, no-show, cancelled], fields: [customer_id, party_size, slot, table_id, notes]}
  Customer: {states: [guest, registered, blocked], fields: [name, phone, email, loyalty_points, khaata_balance, allergens]}
  Discount: {states: [active, expired], fields: [name, kind, value, scope, requires_pin, channel]}
  TaxRule: {states: [active, retired], fields: [region, name, rate, inclusive, applies_to]}
  Branch: {states: [active, suspended], fields: [name, region, currency, timezone, receipt_prefix, fiscal_regime]}
  Staff: {states: [active, suspended], fields: [name, pin_hash, role_id, branch_ids]}
  Role: {states: [active], fields: [name, permissions]}
  InventoryItem: {states: [active, discontinued], fields: [name, unit, on_hand, par_level, cost]}
  Recipe: {states: [active, retired], fields: [menu_item_id, components, yield]}
  StockMovement: {states: [recorded], fields: [inventory_item_id, qty, kind, reference, at]}
  SyncEvent: {states: [pending, sent, acked, conflict], fields: [device_id, seq, entity, payload, created_at]}
invariants:
  - "Order.total == sum(OrderLine.line_total) - Order.discount_total + Order.service_charge + Order.tax_total, computed in minor units"
  - "When TaxRule.inclusive is true, tax_total is extracted from tax-inclusive prices and rounding happens once per Order, not per line"
  - "An Order in state paid has captured Payment amounts summing exactly to Order.total"
  - "An OrderLine in state voided or comped carries a reason and an approver Staff id"
  - "A Shift closes only when every Order opened on its device is paid, void or transferred"
  - "Every offline Order carries a client_uuid and a device_seq that is monotonic per device"
  - "Receipt numbers are gapless and increasing per Branch; a reprint reuses the number and marks Receipt reprinted"
  - "A KitchenTicket is derived from fired OrderLines; it never holds lines that are not on the Order"
  - "A Refund never exceeds the captured amount of its Payment minus prior Refunds"
  - "A Table in state seated or ordered references exactly one open Order"
  - "Merging Tables moves every OrderLine to one surviving Order and voids the others with reason merge"
  - "A Discount that requires a PIN is applied only with an approver Staff id recorded on the Order"
  - "Service charge applies to subtotal after discounts and before tax unless TaxRule says otherwise"
  - "StockMovement of kind sale is written once per served OrderLine using the Recipe of its MenuItem"
  - "A SyncEvent in state conflict is resolved by the server rule last-writer-wins per field except Payment, which is append-only"
  - "MenuItem in state sold-out cannot be added to a new OrderLine on any channel"
  - "Receipt.language is one of the Branch receipt languages and defaults to the Customer preference"
  - "Every state change on Order, Payment, Refund, Shift and Discount writes one audit log event"
  - "A Modifier price_delta is added to OrderLine.modifiers_total once per selected quantity, within its ModifierGroup min and max"
  - "A Tender of kind cash opens the drawer; a Tender of kind card requires a provider_ref and approval_code on its Payment"
  - "A Reservation in state seated references exactly one Table and one open Order"
  - "InventoryItem.on_hand == sum(StockMovement.qty) for that item since the last count"
  - "A Course fires all its OrderLines together; a fired Course keeps its sequence"
  - "A Variant price_delta applies to OrderLine.unit_price before any Modifier"
