entities:
  Product: {states: [draft, active, discontinued], exposure: public, fields: [id, name_en, name_ar, category_id, brand, tax_rule_id, sold_by, track_stock, allow_negative, image]}
  Variant: {states: [active, out-of-stock, discontinued], exposure: public, fields: [product_id, sku, size, colour, price, cost, mrp, reorder_point]}
  Barcode: {states: [active, retired], exposure: derived, fields: [variant_id, code, symbology, kind, embedded, pack_qty]}
  Sale: {states: [open, parked, tendering, paid, partially-returned, returned, void], exposure: public, fields: [id, client_uuid, device_seq, store_id, staff_id, customer_id, subtotal, discount_total, tax_total, total, opened_at, closed_at]}
  SaleLine: {states: [active, voided, returned], exposure: derived, fields: [sale_id, variant_id, qty, weight_g, unit_price, list_price, override_by, promotion_id, discount, tax, line_total, serial]}
  Tender: {states: [pending, authorised, captured, declined, refunded, voided], exposure: public, fields: [sale_id, kind, amount, provider_ref, approval_code, gift_card_id, captured_at]}
  Return: {states: [requested, approved, refunded, exchanged, rejected], exposure: public, fields: [sale_id, lines, reason, refund_method, approver_id, restock]}
  Promotion: {states: [draft, scheduled, active, expired], exposure: internal, fields: [name, kind, rules, priority, stackable, starts_at, ends_at, store_ids]}
  LoyaltyAccount: {states: [active, frozen, closed], exposure: public, fields: [customer_id, points, tier, lifetime_spend]}
  Customer: {states: [guest, registered, blocked], exposure: public, fields: [name, phone, email, khaata_balance, credit_limit, language]}
  GiftCard: {states: [issued, active, redeemed, expired, void], exposure: public, fields: [code_hash, kind, balance, currency, expires_at, issued_sale_id]}
  Layaway: {states: [open, paid, collected, cancelled, expired], exposure: public, fields: [customer_id, sale_id, deposit, balance, due_at]}
  PurchaseOrder: {states: [draft, sent, partially-received, received, closed, cancelled], exposure: public, fields: [supplier_id, store_id, lines, expected_at, total_cost]}
  GoodsReceipt: {states: [draft, posted], exposure: public, fields: [purchase_order_id, supplier_id, store_id, lines, received_by, invoice_ref]}
  StockCount: {states: [planned, counting, review, posted], exposure: public, fields: [store_id, scope, kind, lines, variance_value, approved_by]}
  StockMovement: {states: [recorded], exposure: derived, fields: [variant_id, store_id, qty, kind, reference, reason, at]}
  Transfer: {states: [draft, dispatched, in-transit, received, discrepancy], exposure: public, fields: [from_store_id, to_store_id, lines, dispatched_by, received_by]}
  Supplier: {states: [active, blocked], exposure: public, fields: [name, trn, contact, terms, lead_time_days, return_policy]}
  CashDrawerSession: {states: [open, closed, reconciled], exposure: internal, fields: [store_id, device_id, opened_by, opening_float, drops, pickups, counted, expected, variance]}
  Receipt: {states: [issued, reprinted, voided, reported, report-failed], exposure: internal, fields: [sale_id, store_id, number, fiscal_qr, fiscal_ref, language, issued_at]}
  SyncEvent: {states: [pending, sent, acked, conflict], exposure: internal, fields: [device_id, seq, entity, payload, created_at]}
  TaxRule: {states: [active, retired], exposure: internal, fields: [region, name, rate, inclusive, applies_to]}
  Staff: {states: [active, suspended], exposure: internal, fields: [name, pin_hash, role, store_ids, override_limit_pct]}
  Store: {states: [active, suspended], exposure: internal, fields: [name, region, currency, timezone, receipt_prefix, fiscal_regime, allow_negative_stock]}
contexts: {sales: [Sale, SaleLine, Tender, Receipt, Return, Promotion, TaxRule, CashDrawerSession], catalog: [Product, Variant, Barcode], inventory: [PurchaseOrder, GoodsReceipt, StockCount, StockMovement, Transfer, Supplier], customers: [Customer, LoyaltyAccount, GiftCard, Layaway], people: [Staff, Store], sync: [SyncEvent]}
offline_contexts: [sales, catalog, customers]
invariants:
  - "Sale.total == sum(SaleLine.line_total) - Sale.discount_total + Sale.tax_total, computed once in minor units at tender"
  - "A Sale in state paid has captured Tender amounts summing exactly to Sale.total; change is given only from cash"
  - "Returned qty per SaleLine never exceeds sold qty minus prior Return qty on that SaleLine"
  - "A Return refunds to the original Tender kind unless the approver Staff id authorises store credit on a GiftCard"
  - "Variant on hand == sum(StockMovement.qty) per Store and never negative unless Store.allow_negative_stock is true"
  - "A SaleLine whose unit_price differs from list_price carries override_by, an approver Staff id with override rights"
  - "GiftCard.balance >= 0 at all times; each redemption is a Tender of kind gift-card that decrements balance atomically"
  - "GoodsReceipt qty per line <= PurchaseOrder ordered qty minus received qty plus the Supplier tolerance percent"
  - "A StockCount posted writes exactly one StockMovement of kind count-variance per Variant with non-zero variance"
  - "A Transfer received writes a StockMovement out at the source Store and in at the target Store with equal qty, or a discrepancy"
  - "A weighed SaleLine takes weight_g from the scale or an embedded Barcode; price == unit_price per kg * weight rounded once"
  - "Promotion evaluation is deterministic: best non-stackable Promotion per line by priority, stackable ones applied after"
  - "LoyaltyAccount.points == sum of earned minus redeemed; points are earned on the paid amount net of Return"
  - "A Layaway is collected only when balance == 0; stock is reserved by a StockMovement of kind reserve while open"
  - "Receipt numbers are gapless and increasing per Store; a reprint reuses the number and marks Receipt reprinted"
  - "Every offline Sale carries a client_uuid and a device_seq monotonic per device; each SyncEvent acks exactly once"
  - "A CashDrawerSession closes with expected == opening_float + cash Tender - cash refunds - pickups; variance needs a Staff approver above policy"
  - "Prices are stored tax-inclusive when TaxRule.inclusive is true and tax is extracted once per Sale"
  - "Every state change on Sale, Tender, Return, CashDrawerSession, Promotion and StockCount writes one audit log event"
  - "A Product in state discontinued or a Variant out-of-stock with no allow_negative cannot be added to a new SaleLine"
  - "A Customer khaata_balance never exceeds credit_limit; a Supplier blocked receives no new PurchaseOrder"
