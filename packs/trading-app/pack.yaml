version: "1.5"
complete: false
threshold: 0.7
slug: trading-app
name: Trading App
aliases: [trading app, stock trading app, brokerage app, investment app, forex app, crypto exchange app]
confidence_keywords: [trading, trade, trader, stocks, shares, equities, brokerage, broker, investor, investors, portfolio, p&l, pnl, market order, limit order, order book, depth chart, candlestick, forex, fx, crypto, bitcoin, exchange, dfm, adx, tadawul, psx, nasdaq, kyc, leverage, margin, watchlist, live prices, ticker, deposit, withdraw, securities, sec, mifid, capital markets]
personas: [investor, trader, compliance-officer, support, admin]
jobs:
  - {id: onboard, must: true, screens: [kyc, account-open]}
  - {id: fund, must: true, screens: [deposit, withdraw]}
  - {id: trade, must: true, screens: [watchlist, instrument, order-ticket]}
  - {id: monitor, must: true, screens: [portfolio, pnl]}
  - {id: comply, must: true, screens: [disclosures, risk-warning]}
must_have: [kyc, account-open, deposit-withdraw, live-prices, order-ticket, market-limit-orders, portfolio, pnl, risk-warnings, disclosures, statements, audit-trail]
should_have: [price-alerts, depth-chart, leverage, ipo-subscription, research-feed, two-factor]
entities:
  Account: {states: [pending-kyc, active, restricted, closed]}
  Order: {states: [new, accepted, partially-filled, filled, cancelled, rejected]}
  Position: {states: [open, closed]}
  Transaction: {states: [pending, settled, failed]}
  Instrument: {states: [tradable, halted, delisted]}
invariants:
  - "Cash balance == sum(settled deposits) - sum(settled withdrawals) - sum(filled buys) + sum(filled sells) - fees"
  - "An Order never fills beyond its quantity"
  - "No Order is accepted for an Account outside state active"
  - "A leveraged Order requires an acknowledged risk warning within the session"
integrations: {market-data: [psx-feed, dfm-feed, tadawul-feed, polygon], broker: [fix-gateway, broker-api], kyc: [nadra, uae-pass, jumio], payments: [bank-transfer, jazzcash, easypaisa, stripe]}
regional:
  PK: {regulator: SECP, exchange: PSX, kyc: [nadra, cnic], currency: PKR}
  AE: {regulator: SCA, exchanges: [DFM, ADX], kyc: [uae-pass, emirates-id], currency: AED}
  SA: {regulator: CMA, exchange: Tadawul, kyc: [absher, iqama], currency: SAR}
compliance_must: [KYC/AML before funding, risk disclosure before leveraged trade, best-execution record, immutable order audit trail, statements retention 7y]
nfr_defaults: {offline: forbidden, p95_quote_ms: 100, p95_order_submit_ms: 250, uptime: "99.9%"}
stack_default: {web: nextjs, api: hono, db: postgres, realtime: websocket, mobile: expo}
ui_profile: {style: dense-financial, density: high, touch: 44dp, dark: default, fonts: [Inter, tabular-numerals], charts: candlestick}
questions:
  - {id: market, rank: 1, ask: "Which market first?", answer_type: choice, choices: [PSX, DFM, Tadawul, forex, crypto, other], default: PSX, reversible: false, skip_if_brief_mentions: [psx, pakistan stock, dfm, adx, tadawul, forex, fx, crypto, bitcoin], brief_hints: {PSX: [psx, pakistan stock, karachi stock], DFM: [dfm, adx, dubai financial], Tadawul: [tadawul, saudi exchange], forex: [forex, fx], crypto: [crypto, bitcoin, ethereum]}, maps_to: market.primary}
  - {id: broker-integration, rank: 2, ask: "Do you hold a broker licence, or route through a partner broker?", answer_type: choice, choices: [own-licence, partner-broker], default: partner-broker, reversible: false, followups: [{when: own-licence, ask: [market-data-vendor]}], skip_if_brief_mentions: [licensed broker, our licence, partner broker, white label], brief_hints: {own-licence: [licensed broker, our licence, we are a broker], partner-broker: [partner broker, white label, via a broker]}, maps_to: broker.model}
  - {id: kyc-provider, rank: 3, ask: "KYC via which provider?", answer_type: choice, choices: [nadra, uae-pass, jumio, manual], default: nadra, reversible: true, skip_if_brief_mentions: [nadra, uae pass, jumio, manual kyc], brief_hints: {nadra: [nadra, cnic], uae-pass: [uae pass, emirates id], jumio: [jumio]}, maps_to: kyc.provider}
  - {id: leverage, rank: 4, ask: "Offer leveraged or margin trading?", answer_type: bool, default: false, reversible: false, followups: [{when: true, ask: [leverage-max]}], skip_if_brief_mentions: [leverage, leveraged, margin], maps_to: features.leverage}
  - {id: funding, rank: 5, ask: "Deposit methods?", answer_type: choice, choices: [bank-transfer, wallets, cards, all], default: bank-transfer, reversible: true, followups: [{when: wallets, ask: [wallet-providers]}, {when: all, ask: [wallet-providers]}], skip_if_brief_mentions: [bank transfer, jazzcash, easypaisa, card deposit], brief_hints: {wallets: [jazzcash, easypaisa, wallet], cards: [card deposit, debit card]}, maps_to: funding.methods}
  - {id: platform, rank: 6, ask: "Mobile only, or mobile and web?", answer_type: choice, choices: [mobile, both], default: mobile, reversible: true, skip_if_brief_mentions: [mobile app, mobile only, web and mobile, web platform], brief_hints: {mobile: [mobile app, mobile only], both: [web and mobile, web platform]}, maps_to: platform.targets}
  - {id: region, rank: 7, ask: "Primary country?", answer_type: choice, choices: [PK, AE, SA, other], default: PK, reversible: true, skip_if_brief_mentions: [pakistan, karachi, lahore, dubai, uae, riyadh, saudi], brief_hints: {PK: [pakistan, karachi, lahore, islamabad], AE: [dubai, abu dhabi, uae], SA: [riyadh, jeddah, saudi, ksa]}, maps_to: region.country}
  - {id: market-data-vendor, rank: 8, ask: "Market data vendor?", answer_type: choice, choices: [exchange-direct, polygon, refinitiv, other], default: exchange-direct, reversible: true, maps_to: market.data_vendor}
  - {id: leverage-max, rank: 9, ask: "Maximum leverage offered?", answer_type: number, default: 2, reversible: false, maps_to: features.leverage_max}
  - {id: wallet-providers, rank: 10, ask: "Which wallets?", answer_type: choice, choices: [jazzcash, easypaisa, both], default: both, reversible: true, skip_if_brief_mentions: [jazzcash, easypaisa], brief_hints: {jazzcash: [jazzcash], easypaisa: [easypaisa]}, maps_to: funding.wallets}
reference: {screens: reference/screens.md, workflows: reference/workflows.md, glossary: reference/glossary.csv, compliance: reference/compliance.md, ux_patterns: reference/ux-patterns.md}
