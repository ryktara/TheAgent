  Wallet: {states: [active, frozen], exposure: derived, fields: [account_id, currency, balance, reserved, available]}
  Instrument: {states: [draft, tradable, halted, close-only, delisted], fields: [symbol, venue, asset_class, currency, tick_size, lot_size, max_leverage, shariah_flag, session_hours]}
  Order: {states: [new, accepted, partially-filled, filled, cancelled, rejected], fields: [id, client_order_id, account_id, instrument_id, side, type, tif, qty, limit_price, stop_price, parent_id, oco_group, filled_qty, avg_price, reject_reason, submitted_at]}
  Fill: {states: [booked, busted], exposure: derived, fields: [order_id, exec_id, qty, price, fee, venue, executed_at]}
  Position: {states: [open, closed], exposure: derived, fields: [account_id, instrument_id, qty, avg_cost, realised_pnl, unrealised_pnl, margin_used]}
  LedgerEntry: {states: [posted], exposure: internal, fields: [txn_id, wallet_id, debit, credit, currency, kind, reference, posted_at]}
  Transfer: {states: [requested, held, approved, sent, settled, failed, cancelled], fields: [account_id, direction, rail, amount, currency, beneficiary_id, cooldown_until, travel_rule_ref]}
  RiskLimit: {states: [active, suspended], exposure: internal, fields: [scope, scope_id, jurisdiction, max_leverage, max_order_value, max_position_value, maintenance_margin_pct, stop_out_pct]}
  MarginCall: {states: [open, met, liquidating, closed], fields: [account_id, equity, maintenance, deficit, deadline, opened_at]}
  KycCase: {states: [draft, submitted, in-review, approved, rejected, needs-info, expired], fields: [account_id, tier_requested, vendor, vendor_ref, pep_hit, sanctions_hit, risk_score, reviewer_id, decided_at]}
  ComplianceCase: {states: [open, investigating, escalated, closed-no-action, reported], exposure: internal, fields: [kind, subject_account_id, alert_ids, assignee_id, str_ref, closed_at]}
  Alert: {states: [armed, triggered, disarmed], fields: [account_id, instrument_id, condition, threshold, last_side, triggered_at]}
  Statement: {states: [generating, issued], fields: [account_id, kind, period_start, period_end, file_ref, checksum]}
  Watchlist: {states: [active], fields: [account_id, name, instrument_ids, sort]}
  Quote: {states: [live, stale], exposure: derived, fields: [instrument_id, bid, ask, last, bid_size, ask_size, ts]}
  Candle: {states: [open, closed], exposure: derived, fields: [instrument_id, interval, open, high, low, close, volume, start]}
  NewsItem: {states: [published, retracted], exposure: internal, fields: [source, headline, instrument_ids, url, published_at]}
  PaperAccount: {states: [active, reset], fields: [owner_id, virtual_balance, currency, reset_count]}
  Referral: {states: [invited, signed-up, qualified, rewarded, void], fields: [referrer_id, referee_id, code, reward, qualified_at]}
  CopyLink: {states: [active, paused, stopped], fields: [follower_account_id, leader_account_id, ratio, max_allocation, stop_loss_pct]}
  SupportTicket: {states: [open, pending-customer, escalated, resolved, closed], fields: [account_id, category, is_complaint, sla_due, assignee_id]}
  AuditEvent: {states: [recorded], exposure: internal, fields: [actor_id, actor_role, action, entity, entity_id, before_hash, after_hash, ip, at, prev_hash]}
  Staff: {states: [active, suspended], exposure: internal, fields: [name, email, role, mfa_enrolled, four_eyes_group]}
contexts: {accounts: [Account, Wallet, KycCase, LedgerEntry, Transfer], markets: [Instrument, Quote, Candle, NewsItem, Watchlist], trading: [Order, Fill, Position, RiskLimit, MarginCall, PaperAccount, Alert], compliance: [ComplianceCase, AuditEvent, Statement], growth: [Referral, CopyLink, SupportTicket], people: [Staff]}
offline_contexts: []
invariants:
  - "Every ledger transaction posts LedgerEntry rows whose debits minus credits sum to zero per currency"
  - "Wallet.balance == sum(LedgerEntry credit - debit) for that Wallet; available == balance - reserved"
  - "No Order moves to accepted without a passed buying-power or margin check against RiskLimit and Wallet.available"
  - "Position.qty == sum of signed Fill.qty for its Account and Instrument; Position is never written directly"
  - "Sum of Fill.qty for an Order never exceeds Order.qty; filled_qty == sum(Fill.qty)"
  - "An Order in state cancelled or rejected receives no Fill with executed_at after the state change"
  - "A Transfer of direction withdrawal requires KycCase approved at the tier covering the amount and now >= cooldown_until"
  - "A withdrawal Transfer is paid only to a beneficiary in the name of the Account owner"
  - "Order leverage <= min(Instrument.max_leverage, RiskLimit.max_leverage for the Account jurisdiction)"
  - "A leveraged Order requires Account.risk_ack_at within the current risk-warning version"
  - "A MarginCall opens when Account equity < maintenance margin and at most one MarginCall per Account is open"
  - "When equity falls below the stop-out level of RiskLimit, positions close largest-loss first and an AuditEvent records each close"
  - "An Alert fires once per crossing: it re-arms only after the Quote returns across the threshold"
  - "AuditEvent is append-only; each row carries prev_hash of the previous row so tampering breaks the chain"
  - "Client money sits in segregated Wallet rows; house Wallet rows never net against client rows"
  - "An Order submitted twice with the same client_order_id yields one Order"
  - "A PaperAccount never posts LedgerEntry rows to a real Wallet and its Order rows never route to a venue"
  - "An Islamic Account never accrues overnight swap LedgerEntry rows"
  - "A crypto withdrawal Transfer above the travel-rule threshold carries originator and beneficiary data before it is sent"
  - "A CopyLink copies an Order only when the follower passes the same risk checks as a manual Order"
  - "A Candle is derived from trades; a closed Candle never changes after its interval ends except on a busted Fill"
  - "A Statement is immutable once issued; corrections issue a new Statement referencing the old one"
  - "A KycCase decision and every ComplianceCase closure record a reviewer Staff id different from the case creator"
  - "A SupportTicket flagged as complaint gets an acknowledgement and a due date on creation"
  - "A Referral reward posts only after the referee KycCase is approved and first funding settles"
  - "Only Instrument rows in state tradable accept new Order rows; close-only accepts reducing orders"
